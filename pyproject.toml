[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-dstream"
version = "0.1.0"
description = "Prototype implementation of Adaptive D-Stream for evolving data streams."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "river>=0.21"
]

[tool.setuptools.packages.find]
where = ["src"]
